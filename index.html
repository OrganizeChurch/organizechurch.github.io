<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OrganizeChurch</title>
<meta name="theme-color" content="#0043D2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#F5F9FF;--card:#fff;--tx:#0F172A;--mut:#475569;--pri:#1D4ED8;--lt:#DBEAFE;--bd:#CBD5E1;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0B1220;--card:#131C2E;--tx:#E8EEF9;--mut:#9FB0CB;--pri:#60A5FA;--lt:#1E2F52;--bd:#2A3B5C;--on:#0B1220}}
:root[data-theme=dark]{--bg:#0B1220;--card:#131C2E;--tx:#E8EEF9;--mut:#9FB0CB;--pri:#60A5FA;--lt:#1E2F52;--bd:#2A3B5C;--on:#0B1220}
*{box-sizing:border-box}html{font-size:17px;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
a{color:var(--pri)}:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
header{display:flex;align-items:center;gap:.6rem;padding:.7rem 1rem;background:var(--card);border-bottom:1px solid var(--bd);flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.brand{display:flex;align-items:center;gap:.5rem;font-weight:700;font-size:1.1rem;color:var(--tx);text-decoration:none;margin-right:auto;border:2px solid var(--pri);border-radius:999px;padding:.25rem .5rem .25rem .3rem;background:var(--card);box-shadow:0 3px 0 rgba(37,99,235,.28)}
.brand:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(37,99,235,.28)}
.brand .hm{font-size:.7rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;background:var(--pri);color:var(--bg);border-radius:999px;padding:.2rem .5rem}
main{max-width:860px;margin:0 auto;padding:1rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:1rem;margin:0 0 .9rem}
h1{font-size:1.7rem;line-height:1.2;margin:.2rem 0 .5rem}h2{font-size:1.2rem;margin:.2rem 0 .6rem}h3{font-size:1rem;margin:0}
.mut{color:var(--mut);font-size:.9rem}
button,.btn{min-height:44px;padding:.55rem 1rem;border-radius:10px;border:1px solid var(--pri);background:var(--pri);color:var(--on);font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:.4rem}
button.sec,.btn.sec{background:transparent;color:var(--pri)}button.sm{min-height:36px;padding:.25rem .7rem;font-size:.85rem}
button:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{width:100%;min-height:44px;padding:.5rem .7rem;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
label{display:block;font-weight:600;font-size:.9rem;margin:.6rem 0 .2rem}
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}.row>*{flex:0 0 auto}
.grid{display:grid;gap:.6rem;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.hero{background:linear-gradient(135deg,var(--pri),#38BDF8);color:#fff;border-radius:18px;padding:1.5rem 1.2rem;margin-bottom:1rem}
.hero .btn{background:#fff;color:#1D4ED8;border-color:#fff}.hero .btn.sec{background:transparent;color:#fff}
.tabs{display:flex;gap:.4rem;overflow-x:auto;padding-bottom:.5rem;margin-bottom:.6rem}
.tabs a{white-space:nowrap;padding:.5rem .9rem;border-radius:999px;border:1px solid var(--bd);text-decoration:none;color:var(--tx);background:var(--card);min-height:44px;display:inline-flex;align-items:center}
.tabs a[aria-current=page]{background:var(--pri);color:var(--on);border-color:var(--pri)}
.tag{display:inline-block;padding:.1rem .55rem;border-radius:999px;background:var(--lt);color:var(--pri);font-size:.78rem;font-weight:600}
.item{border-top:1px solid var(--bd);padding:.7rem 0}.item:first-child{border-top:0}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:.5rem}.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:.45rem;border-bottom:1px solid var(--bd);font-size:.9rem}
.note{background:var(--lt);border-radius:10px;padding:.7rem;font-size:.88rem}
:root{--gold:#F59E0B;--mint:#10B981;--rose:#F43F5E}
.card{border-radius:20px;box-shadow:0 4px 14px rgba(29,78,216,.08)}
.hero{border-radius:26px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:rgba(251,191,36,.45)}
.hero>*{position:relative;z-index:1}
.chips{display:flex;gap:.4rem;flex-wrap:wrap;margin:.8rem 0 0}.chips span{background:rgba(255,255,255,.22);padding:.25rem .7rem;border-radius:999px;font-size:.85rem}
#dir a:nth-child(3n+1){border-top:5px solid var(--pri)}#dir a:nth-child(3n+2){border-top:5px solid var(--gold)}#dir a:nth-child(3n){border-top:5px solid var(--mint)}
.stat{text-align:center;border-top:5px solid var(--pri)}.stat.g{border-top-color:var(--gold)}.stat.m{border-top-color:var(--mint)}.stat.r{border-top-color:var(--rose)}.stat h2{font-size:2rem;margin:0}
.ai{border:2px solid var(--gold)}
.sw{display:flex;align-items:flex-start;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}.pn{flex:0 0 100%;scroll-snap-align:start;padding:0 2px}
.sc button{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:999px;white-space:nowrap}.sc button[aria-current=true]{background:var(--pri);color:var(--on);border-color:var(--pri)}
button{box-shadow:0 2px 0 rgba(0,0,0,.12)}button:active{transform:translateY(1px)}
.bub{background:var(--lt);border-radius:14px;padding:.5rem .8rem;margin:.4rem 0}
.qo{display:block;width:100%;margin:.45rem 0;background:var(--card);color:var(--tx);border:2px solid var(--bd);justify-content:flex-start;text-align:left}
.qo.ok{background:var(--mint);color:#fff;border-color:var(--mint);opacity:1}.qo.no{background:var(--rose);color:#fff;border-color:var(--rose);opacity:1}
</style></head><body>
<header id="hd"></header><main id="app"></main>
<script>
const LOGO='<svg aria-hidden="true" width="34" height="34" viewBox="0 0 1024 1024"><defs><linearGradient id="hdbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1a52"/><stop offset="1" stop-color="#1e40af"/></linearGradient><radialGradient id="hdgl" cx=".5" cy=".42" r=".6"><stop offset="0" stop-color="#ffffff" stop-opacity=".16"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient><linearGradient id="hdo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7dd3fc"/><stop offset=".55" stop-color="#38bdf8"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient><linearGradient id="hdc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#f1f6ff"/><stop offset="1" stop-color="#c7dcfa"/></linearGradient><linearGradient id="hdx" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dbeafe"/></linearGradient><clipPath id="hdd"><circle cx="475.0" cy="396.8" r="72"/></clipPath><mask id="hdmo" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><rect width="1024" height="1024" fill="#fff"/><path d="M730.2 402.7A170 170 0 1 0 730.2 621.3" fill="none" stroke="#000" stroke-width="80" stroke-linecap="round"/><circle cx="475.0" cy="396.8" r="72" fill="#fff"/></mask><mask id="hdmc" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><rect width="1024" height="1024" fill="#fff"/><g clip-path="url(#hdd)"><circle cx="350" cy="512" r="170" fill="none" stroke="#000" stroke-width="80"/></g></mask></defs><rect width="1024" height="1024" rx="230" fill="url(#hdbg)"/><rect width="1024" height="1024" rx="230" fill="url(#hdgl)"/><g transform="translate(512 512) scale(1.28) translate(-455.1 -512)"><g mask="url(#hdmo)"><circle cx="350" cy="512" r="170" fill="none" stroke="url(#hdo)" stroke-width="50"/></g><path mask="url(#hdmc)" d="M730.2 402.7A170 170 0 1 0 730.2 621.3" fill="none" stroke="url(#hdc)" stroke-width="50" stroke-linecap="round"/><g clip-path="url(#hdd)"><circle cx="350" cy="512" r="170" fill="none" stroke="url(#hdo)" stroke-width="50"/></g><rect x="288" y="398" width="34" height="226" rx="10" fill="url(#hdx)"/><rect x="242" y="456" width="126" height="34" rx="10" fill="url(#hdx)"/></g></svg>';
const K='oc_v1';let mem=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>new Date().toISOString().slice(0,10);
function seed(){const c=(id,name,city,about)=>({id,name,city,about,mission:'To love God and serve our community.',times:'Sunday 8:00am and 10:30am',contact:'office@example.org',listed:true,members:[],att:[],ann:[],lib:[],photos:[]});
const g=c('grace','Grace Chapel','Port Harcourt','A welcoming family church in the heart of the city.');
g.ann=[{id:uid(),t:'Welcome to Grace Chapel',b:'Join us this Sunday. Everyone is welcome.',pin:true,exp:'',pub:true}];
g.lib=[{id:uid(),t:'Sunday Order of Service',ty:'Programme',vis:'public',txt:'1. Opening hymn\n2. Prayer\n3. Scripture reading\n4. Sermon\n5. Offering\n6. Benediction'}];
g.members=[{id:uid(),n:'Ada Obi',ph:'0800 000 0001',ft:false,fu:'',d:today()},{id:uid(),n:'Tunde Bello',ph:'0800 000 0002',ft:true,fu:'Call this week',d:today()}];
return{churches:[g,c('hope','Hope Fellowship','Abuja','Hope in Christ for every family.')],session:null,theme:'',big:false}}
function load(){try{const r=localStorage.getItem(K);if(r)return JSON.parse(r)}catch(e){}return mem||seed()}
let S=load();
function save(){mem=S;try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
const ch=id=>S.churches.find(c=>c.id===id);
const me=()=>S.session&&ch(S.session);
function applyPrefs(){const r=document.documentElement;S.theme?r.setAttribute('data-theme',S.theme):r.removeAttribute('data-theme');r.style.fontSize=S.big?'20px':'17px'}
function header(){const m=me();document.getElementById('hd').innerHTML=`<a class="brand" href="#/" aria-label="OrganizeChurch home">${LOGO} OrganizeChurch <span class="hm">Home</span></a>
<a class="btn sm" href="#/ai">✨ Ask AI</a><a class="btn sec sm" href="#/quiz">🏆 Challenge</a><button class="sec sm" data-a="big" aria-label="Toggle larger text">A+</button><button class="sec sm" data-a="theme" aria-label="Toggle dark mode">Dark</button>
${m?`<a class="btn sm" href="#/admin/home">My Church</a><button class="sec sm" data-a="out">Sign out</button>`:`<a class="btn sm" href="#/login">Sign in</a>`}`}
function annList(c,pubOnly){const t=today();const a=c.ann.filter(x=>(!pubOnly||x.pub)&&(!x.exp||x.exp>=t)).sort((x,y)=>y.pin-x.pin);
return a.length?a.map(x=>`<div class="item"><h3>${x.pin?'📌 ':''}${esc(x.t)}</h3><p>${esc(x.b)}</p>${x.exp?`<span class="mut">Until ${esc(x.exp)}</span>`:''}</div>`).join(''):'<p class="mut">No announcements right now.</p>'}
function libList(c,pubOnly){const l=c.lib.filter(x=>!pubOnly||x.vis==='public');
return l.length?l.map(x=>`<details class="item"><summary><b>${esc(x.t)}</b> <span class="tag">${esc(x.ty)}</span> <span class="tag">${x.vis==='public'?'Public':'Members only'}</span></summary><pre style="white-space:pre-wrap;font:inherit;margin:.5rem 0">${esc(x.txt)}</pre></details>`).join(''):'<p class="mut">Nothing published yet.</p>'}
const FB_WA='2348122045727';
const fbCard=()=>`<div class="card" id="fbcard"><h2>💬 Tell us what you think</h2><p class="mut">Early churches shape this app. What do you love, and what is missing?</p><label for="fbk">Type</label><select id="fbk"><option>💡 Idea</option><option>🐞 Problem</option><option>❤️ I love this</option><option>❓ Question</option></select><label for="fbm">Your message</label><textarea id="fbm" rows="4" placeholder="Write here..."></textarea><p><button type="button" data-fb="1">Send on WhatsApp</button></p></div>`;
function home(q=''){const l=S.churches.filter(c=>c.listed&&(c.name+c.city).toLowerCase().includes(q.toLowerCase()));
return`<section class="hero"><h1>Your Creative &amp; Admin Assistant</h1><p>Design, document and develop in a Kingdom-styled digital space. Flyers, announcements, sermons, attendance and more, all in one place.</p>
<div class="row"><a class="btn" href="#/register">Register your church</a><a class="btn sec" href="#/bible">📖 Read the Bible</a><a class="btn sec" href="#/login">Sign in</a></div><div class="chips"><span>📖 Programmes</span><span>📸 Photonemory</span><span>📣 Announcements</span><span>👥 Members</span></div><p style="margin:.9rem 0 0;font-weight:700">🎁 Free for early churches. Join now and help shape the app.</p></section>
<div class="card"><h2>Find a church</h2><label for="q">Search by name or city</label><input id="q" type="search" value="${esc(q)}" data-a="search" autocomplete="off">
<div class="grid" id="dir" style="margin-top:.8rem">${dirHtml(l)}</div></div>
<div class="card" style="border-top:5px solid var(--gold)"><h2>📖 Verse of the day</h2><p style="font-size:1.1rem">“${esc(votd()[0])}”</p><div class="mut">${esc(votd()[1])} (KJV)</div><div class="row" style="margin-top:.6rem;gap:.5rem"><button class="sm" data-share="text" data-kind="verse">📤 Share</button><button class="sec sm" data-share="pic" data-kind="verse">🖼️ Share as picture</button></div></div><div class="card" style="border-top:5px solid var(--gold)"><h2>🖼️ Picture of the Day</h2><canvas data-dayart="${dayIdx()}" width="1080" height="1080" role="img" aria-label="Picture of the day: ${esc(votd()[1])}" style="width:100%;height:auto;border-radius:14px;background:#10205a"></canvas><div class="row" style="margin-top:.6rem;gap:.5rem"><button class="sm" data-share="pic" data-kind="art">📤 Share picture</button><button class="sec sm" data-share="save" data-kind="art">⬇️ Save picture</button></div></div><div class="card" style="border-top:5px solid var(--gold)"><h2>🔥 Declaration of the Day</h2><p style="font-size:1.05rem;line-height:1.6">${declHtml()}</p><div class="mut">Based on ${esc(votd()[1])}</div><div class="row" style="margin-top:.6rem;gap:.5rem"><button class="sm" data-share="text" data-kind="decl">📤 Share</button><button class="sec sm" data-share="pic" data-kind="decl">🖼️ Share as picture</button></div></div><div class="card" style="border-top:5px solid var(--mint)"><h2>🏆 Bible Challenge</h2><p>How well do you know the Word? Take the quiz, build your score and challenge a friend.</p><a class="btn" href="#/quiz">Take the challenge</a></div><p class="mut">Anyone can read what a church chooses to publish — no account needed.</p>${fbCard()}`}
const dirHtml=l=>l.length?l.map(c=>`<a class="card" style="margin:0;text-decoration:none;color:inherit" href="#/c/${c.id}"><h3>${esc(c.name)}</h3><div class="mut">${esc(c.city)}</div><div class="mut">${esc(c.times)}</div></a>`).join(''):'<p class="mut">No churches found.</p>';
function church(id){const c=ch(id);if(!c)return'<div class="card">Church not found. <a href="#/">Go home</a></div>';
return`<div class="card"><h1>${esc(c.name)}</h1><div class="mut">${esc(c.city)} · ${esc(c.contact)}</div><p>${esc(c.about)}</p><p><b>Mission:</b> ${esc(c.mission)}</p><p><b>Service times:</b> ${esc(c.times)}</p></div>
<div class="card"><h2>Announcements</h2>${annList(c,true)}</div><div class="card"><h2>Programmes & resources</h2>${libList(c,true)}</div>
<div class="card"><h2>✉️ Message this church</h2><form data-f="msg"><input type="hidden" name="cid" value="${c.id}"><label for="mnm">Your name</label><input id="mnm" name="n" required><label for="mms">Message</label><textarea id="mms" name="m" rows="3" required></textarea><p><button>Send message</button></p></form></div><div class="card"><h2>Photonemory</h2>${c.photos.length?`<div class="photos">${c.photos.map(p=>`<figure style="margin:0"><img src="${p.src}" alt="${esc(p.cap)}"><figcaption class="mut">${esc(p.cap)}</figcaption></figure>`).join('')}</div>`:'<p class="mut">No photos yet.</p>'}</div>`}
function login(){return`<div class="card"><h1>Sign in</h1>
<div class="row"><button class="sec" disabled>Continue with Google</button></div>
<p class="note">Google sign-in switches on when the real backend is connected (next phase). For now, choose a church below to try the admin tools.</p>
<label for="ls">Try as admin of</label><select id="ls">${S.churches.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>
<p><button data-a="demo">Open admin tools</button></p></div>`}
function register(){return`<div class="card"><h1>Register your church</h1><form data-f="reg">
<label for="n">Church name</label><input id="n" name="n" required><label for="ci">City</label><input id="ci" name="ci" required>
<label for="ab">About</label><textarea id="ab" name="ab" rows="3"></textarea><label for="ct">Contact email or phone</label><input id="ct" name="ct">
<p><button>Create church</button></p></form></div>`}
const TABS=[['home','🏠 Dashboard'],['welcome','🎬 Welcome slide'],['members','👥 Members'],['att','✅ Attendance'],['ann','📣 Announcements'],['cel','🎂 Celebrants'],['lib','📖 Service Library'],['uploads','📤 New uploads'],['chat','💬 Chat'],['inbox','✉️ Messages'],['prayer','🙏 Prayer Request'],['pics','🖼️ Pic view'],['photos','📸 Photonemory'],['profile','⛪ Profile']];
function admin(tab){const c=me();if(!c)return'<div class="card">Please <a href="#/login">sign in</a> first.</div>';
const nav=`<h1>${esc(c.name)}</h1><nav class="tabs" aria-label="Church admin">${TABS.map(t=>`<a href="#/admin/${t[0]}" ${t[0]===tab?'aria-current="page"':''}>${t[1]}</a>`).join('')}</nav>`;
const B={home:()=>{const ft=c.members.filter(m=>m.ft).length;return`<div class="grid"><div class="card stat"><h2>${c.members.length}</h2>👥 Members</div><div class="card stat g"><h2>${ft}</h2>👋 First-timers to follow up</div><div class="card stat m"><h2>${c.att.length}</h2>✅ Services recorded</div><div class="card stat r"><h2>${c.ann.length}</h2>📣 Announcements</div></div><div class="card"><h2>Today's Service</h2><p>${esc(c.times)}</p><a class="btn" href="#/c/${c.id}">👉 Swipe view</a></div>`},
members:()=>`<div class="card"><h2>Add member</h2><form data-f="mem"><label for="mn">Full name</label><input id="mn" name="n" required><label for="mp">Phone</label><input id="mp" name="ph"><label><input type="checkbox" name="ft" style="width:auto;min-height:0"> First-timer</label><label for="mf">Follow-up note</label><input id="mf" name="fu"><p><button>Save member</button></p></form></div>
<div class="card scroll"><table><tr><th>Name</th><th>Phone</th><th>Status</th><th></th></tr>${c.members.map(m=>`<tr><td>${esc(m.n)}</td><td>${esc(m.ph)}</td><td>${m.ft?'<span class="tag">First-timer</span> ':''}${esc(m.fu)}</td><td><button class="sec sm" data-a="delm" data-id="${m.id}" aria-label="Remove ${esc(m.n)}">Remove</button></td></tr>`).join('')}</table></div>`,
att:()=>`<div class="card"><h2>Record attendance</h2><form data-f="att"><label for="ad">Date</label><input id="ad" type="date" name="d" value="${today()}" required><label for="an">Service name</label><input id="an" name="s" value="Sunday Service" required>
<label>Present members</label>${c.members.map(m=>`<label style="font-weight:400"><input type="checkbox" name="p" value="${m.id}" style="width:auto;min-height:0"> ${esc(m.n)}</label>`).join('')||'<p class="mut">Add members first.</p>'}
<label for="ac">Visitors (count)</label><input id="ac" type="number" min="0" name="v" value="0"><p><button>Save attendance</button></p></form></div>
<div class="card"><h2>History</h2>${c.att.slice().reverse().map(a=>`<div class="item">${esc(a.d)} · ${esc(a.s)} — <b>${a.p.length+a.v}</b> present (${a.v} visitors)</div>`).join('')||'<p class="mut">None yet.</p>'}</div>`,
ann:()=>`<div class="card"><h2>New announcement</h2><form data-f="ann"><label for="at">Title</label><input id="at" name="t" required><label for="ab2">Message</label><textarea id="ab2" name="b" rows="3" required></textarea><label for="ae">Expires (optional)</label><input id="ae" type="date" name="exp">
<label><input type="checkbox" name="pin" style="width:auto;min-height:0"> Pin to top</label><label><input type="checkbox" name="pub" checked style="width:auto;min-height:0"> Show on public page</label><p><button>Post</button></p></form></div>
<div class="card">${c.ann.map(x=>`<div class="item"><b>${esc(x.t)}</b> ${x.pub?'<span class="tag">Public</span>':'<span class="tag">Church only</span>'} <button class="sec sm" data-a="dela" data-id="${x.id}">Delete</button></div>`).join('')||'<p class="mut">None yet.</p>'}</div>`,
lib:()=>`<div class="card"><h2>Add resource</h2><form data-f="lib"><label for="lt">Title</label><input id="lt" name="t" required><label for="ly">Type</label><select id="ly" name="ty"><option>Programme</option><option>Hymn</option><option>Liturgy</option><option>Sermon</option><option>Other</option></select>
<label for="lv">Who can read it</label><select id="lv" name="vis"><option value="public">Everyone (public)</option><option value="church">Church members only</option></select><label for="lx">Text</label><textarea id="lx" name="txt" rows="5" required></textarea><p><button>Save resource</button></p></form></div><div class="card">${libList(c,false)}</div>`,

photos:()=>`<div class="card"><h2>Add photo</h2><form data-f="photo"><label for="pf">Photo</label><input id="pf" type="file" accept="image/*" required><label for="pc">Caption</label><input id="pc" name="cap" required><p class="note">Only share photos with consent from the people in them.</p><p><button>Upload</button></p></form></div>

inbox:()=>`<div class="card"><h2>✉️ Messages from visitors</h2>${(c.inbox||[]).map(x=>`<div class="item"><b>${esc(x.n)}</b> <span class="mut">${esc(x.d)}</span><p>${esc(x.m)}</p><button class="sec sm" data-a="delmsg" data-id="${x.id}">Delete</button></div>`).join('')||'<p class="mut">No messages yet. Visitors can write to you from your public church page.</p>'}</div>`,

welcome:()=>`<div class='card'><h2>🎬 Welcome slide</h2><p class='mut'>Add a photo that welcomes people at the top of your church page. Add several photos to make a slideshow.</p><form data-f='wel'><label for='wf'>Photo</label><input id='wf' type='file' accept='image/*' required><label for='wc'>Caption (optional)</label><input id='wc' name='cap'><p id='wn' class='mut' role='status'></p><p><button>Add to welcome</button></p></form></div><div class='card'>${(c.welcome||[]).map(x=>`<div class='item'>${x.type==='embed'?`<iframe src='${x.src}' loading='lazy' allowfullscreen style='width:100%;aspect-ratio:16/9;border:0;border-radius:10px'></iframe>`:x.type==='video'?`<video src='${x.src}' controls playsinline style='max-width:100%;max-height:200px;border-radius:10px'></video>`:`<img src='${x.src}' alt='' style='max-width:100%;max-height:200px;border-radius:10px'>`}<p>${esc(x.cap)}</p><button class='sec sm' data-a='delwel' data-id='${x.id}'>Remove</button></div>`).join('')||'<p class="mut">Nothing added yet.</p>'}</div>`,
uploads:()=>`<div class='card'><h2>📤 New uploads</h2><p class='mut'>Hymns, songs, liturgy, programmes and other church documents (PDF, Word, PowerPoint, Excel, text or image, up to 1.5 MB each).</p><form data-f='upl'><label for='uf'>File</label><input id='uf' type='file' accept='.pdf,.docx,.pptx,.xlsx,.txt,.md,.csv,.png,.jpg,.jpeg,.webp' required><label for='ut'>Title</label><input id='ut' name='t' required><label for='uc'>Category</label><select id='uc' name='cat'><option>Hymn</option><option>Song</option><option>Liturgy</option><option>Programme</option><option>Sermon notes</option><option>Other</option></select><label for='uv'>Who can see it</label><select id='uv' name='vis'><option value='public'>Everyone (public)</option><option value='church'>Church members only</option></select><p id='upn' class='mut' role='status'></p><p><button>Upload</button></p></form></div><div class='card'>${upHtml(c,true)}</div>`,
pics:()=>`<div class='card'><h2>🖼️ Pic view pictures</h2><form data-f='photo'><input type='hidden' name='tgt' value='pics'><label for='pf'>Picture</label><input id='pf' type='file' accept='image/*' required><label for='pc'>Caption</label><input id='pc' name='cap' required><p><button>Upload</button></p></form></div><div class='card'>${(c.pics||[]).length?`<div class='photos'>${c.pics.map(p=>`<figure style='margin:0'><img src='${p.src}' alt='${esc(p.cap)}'><button class='sec sm' data-a='delpic' data-id='${p.id}'>Remove</button></figure>`).join('')}</div>`:'<p class="mut">No pictures yet.</p>'}</div>`,
profile:()=>`<div class="card"><h2>Church profile</h2><form data-f="prof"><label for="pn">Name</label><input id="pn" name="name" value="${esc(c.name)}" required><label for="pci">City</label><input id="pci" name="city" value="${esc(c.city)}"><label for="pa">About</label><textarea id="pa" name="about" rows="3">${esc(c.about)}</textarea>

function ai(){return`<div class="card ai"><h1>✨ Ask the Christ-centred AI</h1><p>Ask about the Bible, sermon preparation, writing, learning or everyday questions. Answers aim to point you to Christ and keep Scripture separate from explanation.</p><label for="aq">Your question</label><textarea id="aq" rows="4" placeholder="e.g. Help me outline a short talk on forgiveness"></textarea><p><button data-a="ask">Ask</button></p><div id="ao" class="note" aria-live="polite" style="white-space:pre-wrap">Your answer will appear here.</div></div><p class="mut">AI can make mistakes. It is not divine revelation, and it is not a substitute for your pastor, counsellor or doctor. Check Scripture for yourself.</p>`}
const PROMPT='You are the OrganizeChurch assistant, a general helper with a Christ-centred, Bible-respecting approach. Help with writing, learning, ministry preparation and everyday questions. Rules: clearly label Bible quotations with their reference, keep them short, and keep them separate from your own explanation, which you must introduce as your own explanation. Never present your answers as divine revelation or prophecy. Be warm, humble and honest about uncertainty, and do not invent verses. For sensitive matters such as abuse, self-harm, crisis, health or legal problems, respond with compassion and encourage the person to speak with a trusted pastor, a qualified professional or emergency services. Keep answers concise and easy to read on a phone.';
async function askAI(){const q=document.getElementById('aq').value.trim(),o=document.getElementById('ao');if(!q)return;o.textContent='Thinking…';try{const s=typeof claude!=='undefined'?await claude.use('sample'):null;if(!s){o.textContent='The assistant is not available in this view yet.';return}const r=await s([{role:'user',content:PROMPT+'\n\nQuestion: '+q}],{cache:false,onText:({text})=>{o.textContent=text}});o.textContent=r.text}catch(e){o.textContent=e&&e.code==='not_granted'?'Permission was declined. Reload the page and allow the assistant.':'Sorry, the assistant could not answer right now. Please try again.'}}

n divine favour, order and increase.", "In Jesus' name, Amen."]], ["God is our refuge and strength, a very present help in trouble.", "Psalm 46:1", ["I declare that God is my refuge and my strong tower.", "He is a very present help in every time of trouble.", "I will not fear, though the earth be shaken around me.", "My home, my family and my future are covered by His protection.", "I am safe, steady and held in the hands of God.", "In Jesus' name, Amen."]], ["But my God shall supply all your need according to his riches in glory by Christ Jesus.", "Philippians 4:19", ["I declare that my God supplies all my needs today.", "He provides according to His riches in glory, not my lack.", "I am blessed to be a blessing in every place I go.", "Doors of provision, favour and increase are open to me.", "I will lack no good thing, for my Father is faithful.", "In Jesus' name, Amen."]], ["No weapon that is formed against thee shall prosper.", "Isaiah 54:17", ["I declare that no weapon formed against me shall prosper.", "Every tongue that rises against me in judgment is condemned.", "I am covered by the blood of Jesus and protected by His name.", "Sickness, fear and evil plans cannot stand against me.", "This is my heritage as a servant of the Lord: victory and peace.", "In Jesus' name, Amen."]], ["The Lord is my light and my salvation; whom shall I fear? the Lord is the strength of my life; of whom shall I be afraid?", "Psalm 27:1", ["I declare that the Lord is my light and my salvation.", "I will not fear, for He is the strength of my life.", "Darkness has no hold on my mind, my body or my destiny.", "I walk in the light of His truth and in the joy of His presence.", "Today I am bold, confident and unshakeable in Him.", "In Jesus' name, Amen."]], ["He maketh me to lie down in green pastures: he leadeth me beside the still waters.", "Psalm 23:2", ["I declare that my soul is at rest in the care of my Shepherd.", "He leads me to green pastures and still waters today.", "I will not rush, strive or worry, for He is in control.", "Every weary place in my body and mind is being refreshed.", "I walk in peace, and I lie down and sleep in safety.", "In Jesus' name, Amen."]], ["But they that wait upon the Lord shall renew their strength; they shall mount up with wings as eagles.", "Isaiah 40:31", ["I declare that my strength is being renewed today.", "I wait on the Lord, and I will not faint or grow weary.", "I rise above delay, discouragement and every limitation.", "I mount up with wings as an eagle and I soar in His power.", "What looked impossible is now beneath my feet.", "In Jesus' name, Amen."]], ["It is of the Lord's mercies that we are not consumed, because his compassions fail not. They are new every morning: great is thy faithfulness.", "Lamentations 3:22-23", ["I declare that God's mercies are new over my life this morning.", "His compassions never fail me, and His faithfulness is great.", "Yesterday's mistakes and failures are covered by His grace.", "I step into this day with a fresh start and a fresh anointing.", "I will see the goodness of the Lord in the land of the living.", "In Jesus' name, Amen."]], ["But seek ye first the kingdom of God, and his righteousness; and all these things shall be added unto you.", "Matthew 6:33", ["I declare that I put God first in everything I do today.", "As I seek His kingdom, every need of mine is being added.", "My work, my finances and my family are ordered by His wisdom.", "I will not chase after things, for blessings are chasing me.", "I live under open heavens and I walk in divine increase.", "In Jesus' name, Amen."]], ["I will lift up mine eyes unto the hills, from whence cometh my help. My help cometh from the Lord, which made heaven and earth.", "Psalm 121:1-2", ["I declare that my help comes from the Lord, maker of heaven and earth.", "I lift up my eyes beyond my problems to my God.", "He will not allow my foot to slip, and He never sleeps.", "The Lord watches over my going out and my coming in.", "Help is on the way, and it will arrive right on time.", "In Jesus' name, Amen."]], ["He that dwelleth in the secret place of the most High shall abide under the shadow of the Almighty.", "Psalm 91:1", ["I declare that I dwell in the secret place of the Most High.", "I abide under the shadow of the Almighty today.", "No plague, no accident and no evil will come near my dwelling.", "His angels have charge over me to keep me in all my ways.", "I am hidden, covered and safe in the presence of God.", "In Jesus' name, Amen."]], ["For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life.", "John 3:16", ["I declare that I am deeply and personally loved by God.", "I have received eternal life through Jesus Christ His Son.", "I am forgiven, accepted and called a child of God.", "No failure can separate me from the love of the Father.", "I will love others today the way He has loved me.", "In Jesus' name, Amen."]], ["Come unto me, all ye that labour and are heavy laden, and I will give you rest.", "Matthew 11:28", ["I declare that I come to Jesus and I find rest for my soul.", "Every heavy burden on my shoulders is lifted today.", "I exchange my weariness for His peace and strength.", "His yoke is easy and His burden is light over my life.", "I walk in calm, joy and renewed energy.", "In Jesus' name, Amen."]], ["But as for me and my house, we will serve the Lord.", "Joshua 24:15", ["I declare that as for me and my house, we will serve the Lord.", "My home is a place of peace, love and the presence of God.", "Every member of my household is covered by the blood of Jesus.", "Strife, sickness and lack have no place within my walls.", "My family will be a testimony of God's goodness.", "In Jesus' name, Amen."]], ["Lo, children are an heritage of the Lord: and the fruit of the womb is his reward.", "Psalm 127:3", ["I declare that my children are a heritage and reward from the Lord.", "They are taught of God and great is their peace.", "They will grow in wisdom, favour and divine purpose.", "Every plan of the enemy against their future is cancelled.", "They will walk in light and become a blessing to their generation.", "In Jesus' name, Amen."]], ["And he shall be like a tree planted by the rivers of water, that bringeth forth his fruit in his season; and whatsoever he doeth shall prosper.", "Psalm 1:3", ["I declare that I am like a tree planted by rivers of water.", "I will bear fruit in my season and my leaf shall not wither.", "Whatever I lay my hands on today shall prosper.", "My roots go deep in God's word and no drought can harm me.", "I am productive, fruitful and blessed in every season.", "In Jesus' name, Amen."]], ["For I will restore health unto thee, and I will heal thee of thy wounds, saith the Lord.", "Jeremiah 30:17", ["I declare that the Lord is restoring health to my body today.", "By the stripes of Jesus, I am healed and made whole.", "Every pain, sickness and weakness must leave my body now.", "My wounds are healing and my strength is returning.", "I will live and not die, and declare the works of the Lord.", "In Jesus' name, Amen."]], ["Peace I leave with you, my peace I give unto you: not as the world giveth, give I unto you. Let not your heart be troubled, neither let it be afraid.", "John 14:27", ["I declare that the peace of Christ rules in my heart today.", "My heart is not troubled and my mind is not afraid.", "I receive His peace, which the world cannot give or take away.", "Calm fills my home, my thoughts and my emotions.", "I am steady, still and secure in the Prince of Peace.", "In Jesus' name, Amen."]], ["Now faith is the substance of things hoped for, the evidence of things not seen.", "Hebrews 11:1", ["I declare that I walk by faith and not by sight.", "What I hope for in God is already taking shape in my life.", "Mountains in my way are moving at the word of faith.", "I will not doubt, for God is faithful to His promises.", "I receive my breakthrough with a thankful and believing heart.", "In Jesus' name, Amen."]], ["If any of you lack wisdom, let him ask of God, that giveth to all men liberally, and upbraideth not; and it shall be given him.", "James 1:5", ["I declare that I have the wisdom of God for every decision.", "I ask in faith, and He gives generously without reproach.", "My mind is clear, sharp and led by the Holy Spirit.", "I make wise choices in my work, money and relationships.", "Confusion has no place in me, for God is my counsellor.", "In Jesus' name, Amen."]], ["Call unto me, and I will answer thee, and shew thee great and mighty things, which thou knowest not.", "Jeremiah 33:3", ["I declare that I call upon the Lord and He answers me.", "He is showing me great and mighty things I have not known.", "My prayers are heard and my petitions are granted.", "Revelation, insight and divine ideas are flowing to me today.", "I will see answers to prayers that I have waited for.", "In Jesus' name, Amen."]], ["Behold, I will do a new thing; now it shall spring forth; shall ye not know it? I will even make a way in the wilderness, and rivers in the desert.", "Isaiah 43:19", ["I declare that God is doing a new thing in my life.", "He is making a way in my wilderness and rivers in my desert.", "What seemed closed and stuck is now springing forth.", "I will not dwell on the past, for my future is bright.", "New doors, new seasons and new opportunities are mine.", "In Jesus' name, Amen."]], ["Behold, I have set before thee an open door, and no man can shut it.", "Revelation 3:8", ["I declare that God has set before me an open door.", "No man, no power and no situation can shut what He has opened.", "I walk through every door of opportunity with boldness.", "Divine connections and helpers are coming my way.", "I will enter my place of promise and fulfil my purpose.", "In Jesus' name, Amen."]], ["For thou, Lord, wilt bless the righteous; with favour wilt thou compass him as with a shield.", "Psalm 5:12", ["I declare that I am blessed and highly favoured of the Lord.", "His favour surrounds me like a shield wherever I go.", "Men and women will be kind to me and open doors for me.", "I find grace in every office, meeting and journey today.", "I am the head and not the tail, above and not beneath.", "In Jesus' name, Amen."]], ["But thanks be to God, which giveth us the victory through our Lord Jesus Christ.", "1 Corinthians 15:57", ["I declare that I am walking in victory through Jesus Christ.", "I am more than a conqueror in every battle I face.", "Fear, addiction and failure have no power over me.", "Every enemy that rises against me falls before me.", "I celebrate today because the victory is already won.", "In Jesus' name, Amen."]], ["Weeping may endure for a night, but joy cometh in the morning.", "Psalm 30:5", ["I declare that my season of weeping is coming to an end.", "Joy is rising in my life like the morning sun.", "God is turning my mourning into dancing.", "Every tear I have sown will become a harvest of laughter.", "The night is over, and a new day of gladness has come.", "In Jesus' name, Amen."]], ["Now the God of hope fill you with all joy and peace in believing, that ye may abound in hope, through the power of the Holy Ghost.", "Romans 15:13", ["I declare that the God of hope is filling me with joy and peace.", "I abound in hope by the power of the Holy Spirit.", "Discouragement and despair have no hold on my heart.", "My expectation is in God and it will not be cut off.", "I will rise today with a bright outlook and a grateful spirit.", "In Jesus' name, Amen."]], ["And he said unto me, My grace is sufficient for thee: for my strength is made perfect in weakness.", "2 Corinthians 12:9", ["I declare that the grace of God is sufficient for me.", "His strength is made perfect in my weakness.", "I will not be defeated by what I lack, for He is my supply.", "Where I am tired, He is my strength, and where I am small, He is great.", "I stand today by grace, and I will not fall.", "In Jesus' name, Amen."]], ["For we are his workmanship, created in Christ Jesus unto good works, which God hath before ordained that we should walk in them.", "Ephesians 2:10", ["I declare that I am God's masterpiece, created for a purpose.", "I was designed by Him for good works and a great destiny.", "My gifts, talents and skills are blessed and will make room for me.", "I will not live beneath the plan God has ordained for me.", "I walk in my calling with confidence and joy.", "In Jesus' name, Amen."]], ["Which hope we have as an anchor of the soul, both sure and stedfast.", "Hebrews 6:19", ["I declare that my hope in Christ is an anchor for my soul.", "I am sure, steady and unshaken in every storm.", "The winds may blow, but I will not be driven off course.", "My life is anchored in His promises, and His word cannot fail.", "I stay firm in faith and I will arrive at my expected end.", "In Jesus' name, Amen."]], ["Let your light so shine before men, that they may see your good works, and glorify your Father which is in heaven.", "Matthew 5:16", ["I declare that I am the light of the world.", "I will let my light shine in my home, my work and my community.", "My words and actions today will point people to Jesus.", "Through my life, hearts will be touched and souls will be won.", "I am a blessing, and God is glorified through me.", "In Jesus' name, Amen."]]];

const adLine=k=>ADS[0]+'\n'+APPURL;
function dayText(kind){
  const v=votd();
  if(kind==='art'){const a=window.dayArtLine?window.dayArtLine(dayIdx()):[v[0],v[1]];return`🙏 Prophetic Word of the Day\n${a[0]}\n— ${a[1]} (KJV)\n\n${adLine(kind)}`}

  return`🔥 Declaration of the Day\n${v[2].join('\n')}\n\n(Based on ${v[1]})\n\n${adLine(kind)}`;
}

function capText(kind){return dayText(kind==='art'?'verse':kind==='verse'?'decl':'art')}
function wrapLines(x,text,maxW){const out=[];String(text).split('\n').forEach(par=>{let cur='';par.split(/\s+/).filter(Boolean).forEach(w=>{const t=cur?cur+' '+w:w;if(x.measureText(t).width>maxW&&cur){out.push(cur);cur=w}else cur=t});out.push(cur)});return out}
function dayCard(kind){
  if(kind==='art'&&window.dayArt)return new Promise(res=>window.dayArt(dayIdx()).toBlob(b=>res(b),'image/png'));
  if(window.dayCardArt){window.dayArtReadyLogo&&window.dayArtReadyLogo();return new Promise(res=>window.dayCardArt(kind,votd()).toBlob(b=>res(b),'image/png'))}
  return new Promise(res=>{
    const W=1080,H=1350,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d'),v=votd();
    const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#0a1a52');g.addColorStop(1,'#1e40af');x.fillStyle=g;x.fillRect(0,0,W,H);
    const rg=x.createRadialGradient(W/2,H*.38,40,W/2,H*.38,W*.8);rg.addColorStop(0,'rgba(255,255,255,.14)');rg.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=rg;x.fillRect(0,0,W,H);
    const title=kind==='verse'?'VERSE OF THE DAY':'DECLARATION OF THE DAY',body=kind==='verse'?'“'+v[0]+'”':v[2].join('\n'),ref=kind==='verse'?v[1]+' (KJV)':'Based on '+v[1]+' (KJV)';
    const draw=img=>{
      if(img)x.drawImage(img,W/2-70,70,140,140);
      x.textAlign='center';x.textBaseline='alphabetic';
      x.fillStyle='#7dd3fc';x.font='700 34px Arial, sans-serif';if('letterSpacing' in x)x.letterSpacing='6px';x.fillText(title,W/2,290);if('letterSpacing' in x)x.letterSpacing='0px';
      x.fillStyle='rgba(255,255,255,.35)';x.fillRect(W/2-60,318,120,4);
      let fs=kind==='verse'?64:44,lines,lh;
      for(;fs>=26;fs-=2){x.font=(kind==='verse'?'italic ':'')+'600 '+fs+'px Georgia, "Times New Roman", serif';lines=wrapLines(x,body,W-200);lh=fs*1.4;if(lines.length*lh<=H-700)break}
      const bh=lines.length*lh,y0=360+Math.max(0,(H-700-bh)/2)+fs;
      x.fillStyle='#fff';lines.forEach((ln,i)=>x.fillText(ln,W/2,y0+i*lh));
      x.fillStyle='#bae6fd';x.font='600 38px Arial, sans-serif';x.fillText(ref,W/2,Math.min(H-300,y0+bh+30));
      x.fillStyle='rgba(255,255,255,.12)';x.fillRect(0,H-210,W,210);
      x.fillStyle='#fff';x.font='700 38px Arial, sans-serif';x.fillText('Get the OrganizeChurch app',W/2,H-130);
      x.fillStyle='#7dd3fc';x.font='600 40px Arial, sans-serif';x.fillText('organizechurch.github.io',W/2,H-72);
      c.toBlob(b=>res(b),'image/png');
    };
    const im=new Image();im.onload=()=>draw(im);im.onerror=()=>draw(null);
    im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(LOGO.replace('<svg ','<svg xmlns="http://www.w3.org/2000/svg" ').replace('width="34" height="34"','width="280" height="280"'));
  });
}
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-share]');if(!b)return;
  e.preventDefault();const kind=b.dataset.kind,mode=b.dataset.share,old=b.textContent,say=t=>{b.textContent=t;setTimeout(()=>{b.textContent=old},2600)},text=dayText(kind);
  try{
    if(mode==='save'){const bl=await dayCard(kind),a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='picture-of-the-day.png';document.body.appendChild(a);a.click();a.remove();say('Saved ✓');return}
    if(mode==='pic'){
      say('Making picture…');const bl=await dayCard(kind),f=new File([bl],kind==='verse'?'verse-of-the-day.png':kind==='art'?'picture-of-the-day.png':'declaration-of-the-day.png',{type:'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],text:capText(kind)});return}
      const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=f.name;document.body.appendChild(a);a.click();a.remove();say('Saved ✓ Share it from your gallery');return;
    }
    if(navigator.share){await navigator.share({text});return}
    window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank','noopener');
  }catch(err){if(err&&err.name==='AbortError')return;try{await navigator.clipboard.writeText(text);say('Copied ✓ Paste it anywhere')}catch(x){say('Could not share')}}
});
